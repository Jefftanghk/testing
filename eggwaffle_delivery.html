<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叮叮蛋仔 · 外賣店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF7F0;
    --paper:#FFFFFF;
    --yolk:#FFB627;
    --yolk-deep:#F08C1A;
    --waffle:#8A5A2B;
    --choco:#3A2A1C;
    --ink:#241B12;
    --sub:#8B8378;
    --teal:#0A9C93;
    --teal-deep:#077A73;
    --pink:#E8555A;
    --line:#EEE8DC;
    --shadow: 0 6px 20px rgba(58,42,28,0.10);
    --shadow-lg: 0 -8px 28px rgba(0,0,0,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Noto Sans HK', sans-serif;
    -webkit-font-smoothing:antialiased;
    max-width:480px; margin:0 auto;
    position:relative;
    min-height:100vh;
    padding-bottom:20px;
  }
  .display{ font-family:'Baloo 2','Noto Sans HK',sans-serif; }
  button{ font-family:inherit; }
  img,.ph{ display:block; }

  /* ================= APP SCREENS ================= */
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ================= TOP BAR (search) ================= */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--paper);
    padding:10px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 1px 0 var(--line);
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%; border:1px solid var(--line);
    background:var(--paper); font-size:16px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .search-box{
    flex:1; background:var(--cream); border-radius:12px; padding:9px 12px;
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); font-weight:600;
  }
  .fav-btn{
    width:34px;height:34px;border-radius:50%; border:1px solid var(--line);
    background:var(--paper); font-size:15px; cursor:pointer; flex-shrink:0;
  }

  /* ================= STORE COVER ================= */
  .cover{
    position:relative; height:150px;
    background:
      radial-gradient(circle at 20px 20px, rgba(255,255,255,0.35) 8px, transparent 9px) 0 0/40px 40px,
      linear-gradient(135deg, var(--yolk) 0%, var(--yolk-deep) 100%);
  }
  .cover .badge-open{
    position:absolute; top:12px; right:14px;
    background:rgba(255,255,255,0.9); color:var(--teal-deep);
    font-size:11px; font-weight:800; padding:5px 10px; border-radius:20px;
  }
  .store-card{
    background:var(--paper); margin:-26px 14px 0; border-radius:18px;
    padding:14px 16px 16px; box-shadow:var(--shadow); position:relative; z-index:2;
  }
  .store-top{ display:flex; gap:12px; }
  .store-logo{
    width:56px;height:56px;border-radius:16px; background:var(--paper); border:3px solid var(--paper);
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:28px;
    margin-top:-30px; flex-shrink:0;
  }
  .store-name{ font-size:17px; font-weight:800; margin:0 0 2px; }
  .store-meta{ font-size:11.5px; color:var(--sub); font-weight:600; }
  .store-stats{
    display:flex; gap:14px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
  }
  .stat{ text-align:center; flex:1; }
  .stat b{ display:block; font-size:14px; font-weight:800; }
  .stat span{ font-size:10px; color:var(--sub); font-weight:600; }
  .stat.rating b{ color:var(--yolk-deep); }

  .mode-toggle{
    display:flex; margin:14px 14px 0; background:var(--paper); border-radius:14px; padding:4px;
    box-shadow:var(--shadow);
  }
  .mode-toggle button{
    flex:1; border:none; background:none; padding:9px 0; border-radius:11px;
    font-size:12.5px; font-weight:800; color:var(--sub); cursor:pointer;
  }
  .mode-toggle button.active{ background:var(--choco); color:var(--cream); }

  /* ================= PROMO BANNER ================= */
  .promo-scroll{
    display:flex; gap:10px; overflow-x:auto; padding:14px 14px 4px;
  }
  .promo-card{
    flex:0 0 auto; width:220px; height:76px; border-radius:14px;
    background:linear-gradient(120deg,#FFE3B0,#FFC24B);
    padding:12px 14px; position:relative; overflow:hidden;
  }
  .promo-card.alt{ background:linear-gradient(120deg,#BFF0EC,#7FDAD1); }
  .promo-tag{ font-size:9.5px; font-weight:800; background:rgba(58,42,28,0.15); color:var(--choco); padding:2px 7px; border-radius:8px; }
  .promo-title{ font-size:13px; font-weight:800; margin:6px 0 0; color:var(--choco); }
  .promo-sub{ font-size:10.5px; font-weight:600; color:var(--choco); opacity:0.75; }

  /* ================= CATEGORY TABS ================= */
  .cat-tabs{
    position:sticky; top:53px; z-index:25; background:var(--cream);
    display:flex; gap:8px; overflow-x:auto; padding:14px 14px 10px;
    border-bottom:1px solid var(--line);
  }
  .cat-tab{
    flex:0 0 auto; padding:8px 15px; border-radius:20px; border:1px solid var(--line);
    background:var(--paper); font-size:12.5px; font-weight:700; color:var(--sub); cursor:pointer;
    white-space:nowrap;
  }
  .cat-tab.active{ background:var(--teal); border-color:var(--teal); color:white; }

  /* ================= ITEM LIST ================= */
  .cat-section{ padding:16px 14px 4px; }
  .cat-section h3{ font-size:15px; font-weight:800; margin:0 0 10px; }
  .item-row{
    display:flex; gap:12px; padding:12px; background:var(--paper); border-radius:16px;
    box-shadow:var(--shadow); margin-bottom:10px; cursor:pointer; position:relative;
    align-items:center;
  }
  .item-photo{
    width:76px;height:76px;border-radius:12px; flex-shrink:0; position:relative; overflow:hidden;
  }
  .item-photo .bubbles{
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.5) 28%, transparent 30%);
    background-size:14px 14px; opacity:0.6;
  }
  .item-photo.blank{
    background: repeating-linear-gradient(45deg, #F3ECDD, #F3ECDD 6px, #EDE3CD 6px, #EDE3CD 12px);
    border:1.5px dashed rgba(74,46,30,0.28);
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .item-photo.blank span{ font-size:8.5px; font-weight:700; color:var(--waffle); padding:0 4px; }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:14.5px; font-weight:800; margin:0 0 3px; }
  .item-desc{ font-size:11.5px; color:var(--sub); font-weight:500; margin:0 0 6px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .item-price{ font-size:13.5px; font-weight:800; }
  .item-price .old{ text-decoration:line-through; color:var(--sub); font-weight:600; font-size:11px; margin-right:5px; }
  .item-badge{
    position:absolute; top:8px; left:8px; font-size:9px; font-weight:800; color:white;
    background:var(--pink); padding:2px 7px; border-radius:8px;
  }
  .add-btn{
    width:28px;height:28px;border-radius:50%; border:none; background:var(--teal); color:white;
    font-size:17px; font-weight:700; cursor:pointer; flex-shrink:0; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .add-btn.qty{
    width:auto; border-radius:14px; padding:0 4px; gap:6px; background:var(--teal);
  }
  .qty-inline{ display:flex; align-items:center; gap:8px; }
  .qty-inline button{
    width:24px;height:24px;border-radius:50%; border:none; background:rgba(255,255,255,0.25); color:white;
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .qty-inline .n{ font-size:13px; font-weight:800; color:white; min-width:12px; text-align:center; }

  /* ================= ITEM DETAIL SHEET ================= */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(36,27,18,0.5); z-index:60;
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    background:var(--paper); width:100%; max-width:480px; border-radius:24px 24px 0 0;
    max-height:88vh; overflow-y:auto; position:relative; animation:slideUp .25s ease;
  }
  @keyframes slideUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-photo{ height:190px; position:relative; }
  .sheet-photo .bubbles{
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.45) 26%, transparent 28%);
    background-size:22px 22px; opacity:0.55;
  }
  .sheet-photo.blank{
    background: repeating-linear-gradient(45deg, #F3ECDD, #F3ECDD 9px, #EDE3CD 9px, #EDE3CD 18px);
    display:flex; align-items:center; justify-content:center;
  }
  .sheet-photo.blank span{ font-size:12px; font-weight:700; color:var(--waffle); background:rgba(255,255,255,0.6); padding:4px 10px; border-radius:10px; }
  .sheet-close{
    position:absolute; top:14px; right:14px; width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.9); border:none; font-size:15px; font-weight:700; cursor:pointer; z-index:2;
  }
  .sheet-body{ padding:18px 20px 100px; }
  .sheet-title{ font-size:20px; font-weight:800; margin:0 0 4px; }
  .sheet-price{ font-size:15px; font-weight:800; color:var(--teal-deep); margin:0 0 10px; }
  .sheet-desc{ font-size:13px; color:var(--sub); font-weight:500; line-height:1.6; margin:0 0 18px; }
  .opt-group{ margin-bottom:20px; }
  .opt-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .opt-head h4{ font-size:14px; font-weight:800; margin:0; }
  .opt-head span{ font-size:10.5px; font-weight:700; color:var(--sub); background:var(--cream); padding:3px 8px; border-radius:8px; }
  .opt-row{
    display:flex; align-items:center; justify-content:space-between; padding:11px 0;
    border-bottom:1px solid var(--line); font-size:13.5px; font-weight:600;
  }
  .opt-row:last-child{ border-bottom:none; }
  .opt-left{ display:flex; align-items:center; gap:10px; }
  .opt-extra{ font-size:12px; color:var(--sub); font-weight:700; }
  .radio, .checkbox{
    width:19px;height:19px; border:2px solid var(--line); flex-shrink:0; cursor:pointer;
  }
  .radio{ border-radius:50%; }
  .checkbox{ border-radius:5px; }
  .radio.checked{ border-color:var(--teal); background:radial-gradient(circle, var(--teal) 45%, white 46%); }
  .checkbox.checked{ border-color:var(--teal); background:var(--teal); color:white; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .note-box{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; font-size:13px;
    font-family:inherit; resize:none; background:var(--cream); margin-top:4px;
  }
  .sheet-footer{
    position:sticky; bottom:0; background:var(--paper); padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); display:flex; align-items:center; gap:12px;
  }
  .sheet-stepper{
    display:flex; align-items:center; gap:12px; background:var(--cream); border-radius:14px; padding:6px 10px;
  }
  .sheet-stepper button{
    width:28px;height:28px;border-radius:50%; border:none; background:var(--choco); color:white; font-size:17px; cursor:pointer;
  }
  .sheet-stepper .n{ font-size:15px; font-weight:800; min-width:14px; text-align:center; }
  .sheet-add-btn{
    flex:1; border:none; background:var(--teal); color:white; font-weight:800; font-size:14.5px;
    padding:13px; border-radius:14px; cursor:pointer; display:flex; justify-content:space-between; padding-left:16px; padding-right:16px;
  }

  /* ================= FLOATING CART BAR ================= */
  .cart-bar{
    position:fixed; left:50%; transform:translateX(-50%) translateY(120%); bottom:14px;
    width:calc(100% - 28px); max-width:452px;
    background:var(--teal); color:white; border-radius:16px;
    padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 10px 26px rgba(10,156,147,0.35); z-index:40; cursor:pointer;
    transition:transform .3s ease;
  }
  .cart-bar.show{ transform:translateX(-50%) translateY(0); }
  .cart-bar-left{ display:flex; align-items:center; gap:10px; }
  .cart-bubble{
    background:rgba(255,255,255,0.25); width:26px;height:26px;border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
  }
  .cart-bar-title{ font-size:13.5px; font-weight:800; }
  .cart-bar-right{ font-size:13.5px; font-weight:800; display:flex; align-items:center; gap:6px; }

  /* ================= CART SCREEN ================= */
  .cart-header{
    display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--paper); z-index:10;
  }
  .cart-header h2{ font-size:16px; font-weight:800; margin:0; }
  .cart-store-strip{
    display:flex; align-items:center; gap:10px; padding:14px; margin:0 14px; margin-top:14px;
    background:var(--paper); border-radius:14px; box-shadow:var(--shadow);
  }
  .cart-store-strip .ic{ font-size:20px; }
  .cart-store-strip b{ font-size:13.5px; }
  .cart-store-strip span{ display:block; font-size:11px; color:var(--sub); font-weight:600; }
  .cart-list{ padding:14px; }
  .cart-item{
    display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); align-items:flex-start;
  }
  .cart-item-photo{ width:56px;height:56px;border-radius:10px; flex-shrink:0; position:relative; overflow:hidden; }
  .cart-item-photo .bubbles{
    position:absolute; inset:0; background-image: radial-gradient(circle, rgba(255,255,255,0.5) 26%, transparent 28%); background-size:11px 11px; opacity:0.6;
  }
  .cart-item-photo.blank{ background: repeating-linear-gradient(45deg, #F3ECDD, #F3ECDD 5px, #EDE3CD 5px, #EDE3CD 10px); }
  .cart-item-info{ flex:1; }
  .cart-item-name{ font-size:13.5px; font-weight:800; margin:0 0 3px; }
  .cart-item-opts{ font-size:11px; color:var(--sub); font-weight:600; margin:0 0 8px; line-height:1.5; }
  .cart-item-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .cart-item-price{ font-size:13px; font-weight:800; }
  .cart-item-stepper{ display:flex; align-items:center; gap:10px; background:var(--cream); border-radius:12px; padding:4px 8px; }
  .cart-item-stepper button{ width:22px;height:22px;border-radius:50%; border:none; background:var(--choco); color:white; font-size:13px; cursor:pointer; }
  .cart-item-stepper .n{ font-size:12.5px; font-weight:800; min-width:12px; text-align:center; }

  .promo-input-row{
    display:flex; gap:8px; margin:14px 14px 0; background:var(--paper); border-radius:14px; padding:12px 14px;
    box-shadow:var(--shadow); align-items:center;
  }
  .promo-input-row input{ flex:1; border:none; font-size:13px; font-family:inherit; background:none; }
  .promo-input-row button{ border:none; background:var(--yolk); color:var(--choco); font-weight:800; font-size:12px; padding:8px 14px; border-radius:10px; cursor:pointer; }

  .fee-card{
    margin:14px; background:var(--paper); border-radius:14px; padding:16px; box-shadow:var(--shadow);
  }
  .fee-row{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:var(--sub); padding:6px 0; }
  .fee-row.total{ color:var(--ink); font-size:15.5px; font-weight:800; border-top:1px solid var(--line); margin-top:8px; padding-top:12px; }
  .fee-row .discount{ color:var(--teal-deep); }

  .addr-card{
    margin:14px; background:var(--paper); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:12px;
  }
  .addr-card .ic{ font-size:20px; }
  .addr-card b{ font-size:13.5px; display:block; }
  .addr-card span{ font-size:11.5px; color:var(--sub); font-weight:600; }
  .addr-card .chg{ margin-left:auto; font-size:12px; font-weight:800; color:var(--teal-deep); }

  .checkout-footer{
    position:sticky; bottom:0; background:var(--paper); padding:14px calc(14px) calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); margin-top:10px;
  }
  .checkout-btn{
    width:100%; border:none; background:var(--teal); color:white; font-weight:800; font-size:15px;
    padding:15px; border-radius:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; padding-left:20px; padding-right:20px;
  }

  /* ================= CONFIRM SCREEN ================= */
  .confirm-wrap{ padding:60px 30px; text-align:center; }
  .confirm-icon{
    width:84px;height:84px;border-radius:50%; background:var(--teal); color:white; font-size:38px;
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
  }
  .confirm-wrap h2{ font-size:21px; font-weight:800; margin:0 0 8px; }
  .confirm-wrap p{ font-size:13px; color:var(--sub); font-weight:600; margin:0 0 26px; line-height:1.6; }
  .confirm-track{
    background:var(--paper); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); text-align:left; margin-bottom:20px;
  }
  .track-row{ display:flex; gap:12px; align-items:flex-start; padding:8px 0; }
  .track-dot{ width:10px;height:10px;border-radius:50%; background:var(--teal); margin-top:5px; flex-shrink:0; }
  .track-dot.pending{ background:var(--line); }
  .track-text b{ display:block; font-size:13px; font-weight:800; }
  .track-text span{ font-size:11px; color:var(--sub); font-weight:600; }
  .confirm-btn2{
    width:100%; border:none; background:var(--choco); color:var(--cream); font-weight:800; font-size:14px;
    padding:14px; border-radius:14px; cursor:pointer;
  }

  .empty-cart{ text-align:center; padding:60px 30px; color:var(--sub); font-size:13px; font-weight:600; }
</style>
</head>
<body>

<!-- ===================== STORE SCREEN ===================== -->
<div class="screen active" id="storeScreen">

  <div class="topbar">
    <button class="back-btn">←</button>
    <div class="search-box">🔍 喺叮叮蛋仔度搵嘢食…</div>
    <button class="fav-btn">♡</button>
  </div>

  <div class="cover">
    <div class="badge-open">🟢 營業中</div>
  </div>

  <div class="store-card">
    <div class="store-top">
      <div class="store-logo">🥚</div>
      <div>
        <p class="store-name">叮叮蛋仔 DingDing Waffle</p>
        <p class="store-meta">街坊小食 · 深水埗桂林街 42 號</p>
      </div>
    </div>
    <div class="store-stats">
      <div class="stat rating"><b>4.8 ★</b><span>2.3k 評分</span></div>
      <div class="stat"><b>12–18 分鐘</b><span>預計時間</span></div>
      <div class="stat"><b>HK$0</b><span>自取免運</span></div>
    </div>
  </div>

  <div class="mode-toggle">
    <button class="active" data-mode="delivery">🛵 外賣</button>
    <button data-mode="pickup">🏠 自取</button>
  </div>

  <div class="promo-scroll">
    <div class="promo-card">
      <span class="promo-tag">優惠碼 EGG10</span>
      <p class="promo-title">滿$50減$10</p>
      <p class="promo-sub">首次落單專享</p>
    </div>
    <div class="promo-card alt">
      <span class="promo-tag">套餐優惠</span>
      <p class="promo-title">蛋仔+飲品 -15%</p>
      <p class="promo-sub">今日限定</p>
    </div>
  </div>

  <div class="cat-tabs" id="catTabs"></div>

  <div id="catSections"></div>

</div>

<!-- ===================== CART SCREEN ===================== -->
<div class="screen" id="cartScreen">
  <div class="cart-header">
    <button class="back-btn" id="cartBack">←</button>
    <h2>購物車</h2>
  </div>

  <div id="cartBody"></div>
</div>

<!-- ===================== CONFIRM SCREEN ===================== -->
<div class="screen" id="confirmScreen">
  <div class="confirm-wrap">
    <div class="confirm-icon">✓</div>
    <h2>訂單已確認！</h2>
    <p>叮叮蛋仔已經接單，用返選咗嘅方式，準時嚟到手上就得㗎啦。</p>
    <div class="confirm-track">
      <div class="track-row"><div class="track-dot"></div><div class="track-text"><b>已落單</b><span>剛剛</span></div></div>
      <div class="track-row"><div class="track-dot"></div><div class="track-text"><b>店舖準備中</b><span>預計 6 分鐘</span></div></div>
      <div class="track-row"><div class="track-dot pending"></div><div class="track-text"><b>準備取餐 / 送出</b><span>預計 12 分鐘</span></div></div>
      <div class="track-row"><div class="track-dot pending"></div><div class="track-text"><b>完成</b><span>—</span></div></div>
    </div>
    <button class="confirm-btn2" id="backToStore">返回店舖</button>
  </div>
</div>

<!-- ===================== ITEM DETAIL SHEET ===================== -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<!-- ===================== FLOATING CART BAR ===================== -->
<div class="cart-bar" id="cartBar">
  <div class="cart-bar-left">
    <div class="cart-bubble" id="cartBubble">0</div>
    <span class="cart-bar-title">查看購物車</span>
  </div>
  <div class="cart-bar-right"><span id="cartBarTotal">HK$0</span> →</div>
</div>

<script>
/* ===================== DATA ===================== */
const menu = [
  { cat:'招牌熱賣', items:[
    { id:'original', name:'原味脆皮蛋仔', desc:'外脆內軟，叮叮蛋仔招牌口味，熱賣No.1。', price:22, oldPrice:null, photo:true, tagBadge:'熱賣',
      options:[
        { type:'radio', title:'份量', required:true, choices:[
          {label:'半底 (6粒)', extra:0}, {label:'正常底 (10粒)', extra:0}, {label:'加大底 (14粒)', extra:8}
        ]},
        { type:'checkbox', title:'加配料', required:false, choices:[
          {label:'加煉奶', extra:4}, {label:'加朱古力醬', extra:5}, {label:'加花生醬', extra:5}
        ]}
      ]},
    { id:'choco', name:'朱古力醬蛋仔', desc:'濃滑朱古力醬夾心，朱古力控必試。', price:26, oldPrice:30, photo:true, tagBadge:'限時優惠',
      options:[
        { type:'radio', title:'份量', required:true, choices:[
          {label:'半底 (6粒)', extra:0}, {label:'正常底 (10粒)', extra:0}
        ]},
        { type:'checkbox', title:'加配料', required:false, choices:[
          {label:'加朱古力粒', extra:6}, {label:'加棉花糖', extra:5}
        ]}
      ]},
  ]},
  { cat:'季節限定', items:[
    { id:'matcha', name:'抹茶紅豆蛋仔', desc:'日式抹茶配香甜紅豆蓉，和風限定口味。', price:28, oldPrice:null, photo:true, tagBadge:'新品',
      options:[
        { type:'radio', title:'份量', required:true, choices:[
          {label:'正常底 (10粒)', extra:0}, {label:'加大底 (14粒)', extra:8}
        ]}
      ]},
    { id:'taro', name:'紫薯香芋蛋仔', desc:'香濃芋泥餡料，紫薯控會愛上。', price:28, oldPrice:null, photo:false, tagBadge:'限量',
      options:[
        { type:'radio', title:'份量', required:true, choices:[
          {label:'正常底 (10粒)', extra:0}
        ]}
      ]},
  ]},
  { cat:'其他口味', items:[
    { id:'blackSesame', name:'黑芝麻蛋仔', desc:'香濃黑芝麻醬，香氣十足。', price:26, oldPrice:null, photo:true, tagBadge:null,
      options:[
        { type:'radio', title:'份量', required:true, choices:[
          {label:'正常底 (10粒)', extra:0}, {label:'加大底 (14粒)', extra:8}
        ]}
      ]},
    { id:'cheese', name:'芝士拉絲蛋仔', desc:'熱食芝士拉絲口感，新品推薦。', price:30, oldPrice:null, photo:false, tagBadge:'新品',
      options:[
        { type:'radio', title:'份量', required:true, choices:[
          {label:'正常底 (10粒)', extra:0}
        ]}
      ]},
  ]},
  { cat:'飲品 & 加購', items:[
    { id:'lemontea', name:'凍檸茶', desc:'香港街坊經典凍飲，配蛋仔一流。', price:12, oldPrice:null, photo:false, tagBadge:null, options:[] },
    { id:'ecobag', name:'環保蛋仔袋', desc:'方便攜帶保溫袋。', price:2, oldPrice:null, photo:false, tagBadge:null, options:[] },
  ]},
];

const allItems = {};
menu.forEach(sec=>sec.items.forEach(it=>allItems[it.id]=it));

/* ===================== STATE ===================== */
// cart: array of { itemId, qty, selections: {groupIndex: [choiceIndex,...]}, note, unitPrice }
let cart = [];
let currentMode = 'delivery';
let activeSheetItem = null;
let sheetSelections = {};
let sheetQty = 1;

/* ===================== RENDER: CATEGORY TABS + LIST ===================== */
const catTabs = document.getElementById('catTabs');
const catSections = document.getElementById('catSections');

function renderMenu(){
  catTabs.innerHTML = menu.map((sec,i)=>`<button class="cat-tab ${i===0?'active':''}" data-idx="${i}">${sec.cat}</button>`).join('');
  catSections.innerHTML = menu.map(sec=>`
    <div class="cat-section" id="sec-${sec.cat}">
      <h3>${sec.cat}</h3>
      ${sec.items.map(it=>itemRowHtml(it)).join('')}
    </div>
  `).join('');

  catTabs.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click', e=>{
      catTabs.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      const idx = e.currentTarget.dataset.idx;
      document.getElementById(`sec-${menu[idx].cat}`).scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  document.querySelectorAll('.item-row').forEach(row=>{
    row.addEventListener('click', e=>{
      if(e.target.closest('.add-btn') || e.target.closest('.qty-inline')) return;
      openSheet(row.dataset.id);
    });
  });

  document.querySelectorAll('.add-btn[data-simple]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      quickAdd(e.currentTarget.dataset.simple);
    });
  });

  document.querySelectorAll('.qty-inline button').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = e.currentTarget.dataset.id;
      const delta = parseInt(e.currentTarget.dataset.delta);
      adjustSimpleQty(id, delta);
    });
  });
}

function cartQtyForSimple(id){
  return cart.filter(c=>c.itemId===id && c.simple).reduce((s,c)=>s+c.qty,0);
}

function itemRowHtml(it){
  const photoInner = it.photo
    ? `<div class="bubbles"></div>`
    : `<span>未上載相片</span>`;
  const badge = it.tagBadge ? `<div class="item-badge">${it.tagBadge}</div>` : '';
  const priceHtml = it.oldPrice
    ? `<span class="old">HK$${it.oldPrice}</span>HK$${it.price}`
    : `HK$${it.price}`;
  const hasOptions = it.options && it.options.length>0;
  let actionHtml;
  if(hasOptions){
    actionHtml = `<button class="add-btn">+</button>`;
  } else {
    const qty = cartQtyForSimple(it.id);
    actionHtml = qty>0
      ? `<div class="qty-inline" style="background:var(--teal); border-radius:14px; padding:3px 8px;">
           <button data-id="${it.id}" data-delta="-1">−</button>
           <span class="n">${qty}</span>
           <button data-id="${it.id}" data-delta="1">+</button>
         </div>`
      : `<button class="add-btn" data-simple="${it.id}">+</button>`;
  }
  return `
    <div class="item-row" data-id="${it.id}">
      <div class="item-photo ${it.photo?'':'blank'}" style="${it.photo?`background:linear-gradient(135deg,#FFD873,#F0A93A)`:''}">
        ${photoInner}
        ${badge}
      </div>
      <div class="item-info">
        <p class="item-name">${it.name}</p>
        <p class="item-desc">${it.desc}</p>
        <div class="item-bottom">
          <span class="item-price">${priceHtml}</span>
          ${actionHtml}
        </div>
      </div>
    </div>
  `;
}

function quickAdd(id){
  const it = allItems[id];
  const existing = cart.find(c=>c.itemId===id && c.simple);
  if(existing){ existing.qty++; }
  else { cart.push({ itemId:id, qty:1, simple:true, selections:{}, note:'', unitPrice:it.price }); }
  refreshAll();
}

function adjustSimpleQty(id, delta){
  const existing = cart.find(c=>c.itemId===id && c.simple);
  if(!existing) return;
  existing.qty += delta;
  if(existing.qty<=0) cart = cart.filter(c=>c!==existing);
  refreshAll();
}

/* ===================== ITEM DETAIL SHEET ===================== */
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetContent = document.getElementById('sheetContent');

function openSheet(id){
  activeSheetItem = allItems[id];
  sheetSelections = {};
  sheetQty = 1;
  (activeSheetItem.options||[]).forEach((grp,gi)=>{
    if(grp.type==='radio') sheetSelections[gi] = [0];
    else sheetSelections[gi] = [];
  });
  renderSheet();
  sheetOverlay.classList.add('show');
}

function sheetUnitPrice(){
  let total = activeSheetItem.price;
  (activeSheetItem.options||[]).forEach((grp,gi)=>{
    (sheetSelections[gi]||[]).forEach(ci=>{ total += grp.choices[ci].extra; });
  });
  return total;
}

function renderSheet(){
  const it = activeSheetItem;
  const photoInner = it.photo
    ? `<div class="bubbles"></div>`
    : `<span>店主未上載相片 · 先用底色代替</span>`;
  const optionsHtml = (it.options||[]).map((grp,gi)=>{
    const rows = grp.choices.map((ch,ci)=>{
      const checked = (sheetSelections[gi]||[]).includes(ci);
      return `
        <div class="opt-row">
          <div class="opt-left">
            <div class="${grp.type} ${checked?'checked':''}" data-gi="${gi}" data-ci="${ci}">${grp.type==='checkbox'&&checked?'✓':''}</div>
            <span>${ch.label}</span>
          </div>
          <span class="opt-extra">${ch.extra>0 ? '+HK$'+ch.extra : '免費'}</span>
        </div>
      `;
    }).join('');
    return `
      <div class="opt-group">
        <div class="opt-head">
          <h4>${grp.title}</h4>
          <span>${grp.required ? '必選 1 項' : '可選'}</span>
        </div>
        ${rows}
      </div>
    `;
  }).join('');

  sheetContent.innerHTML = `
    <div class="sheet-photo ${it.photo?'':'blank'}" style="${it.photo?`background:linear-gradient(135deg,#FFD873,#F0A93A)`:''}">
      <button class="sheet-close" id="sheetCloseBtn">✕</button>
      ${photoInner}
    </div>
    <div class="sheet-body">
      <p class="sheet-title">${it.name}</p>
      <p class="sheet-price">HK$${it.price} 起</p>
      <p class="sheet-desc">${it.desc}</p>
      ${optionsHtml}
      <div class="opt-group">
        <div class="opt-head"><h4>備註</h4><span>可選</span></div>
        <textarea class="note-box" rows="2" id="sheetNote" placeholder="例如：少甜 / 走葱 / 唔該加多隻叉...">${''}</textarea>
      </div>
    </div>
    <div class="sheet-footer">
      <div class="sheet-stepper">
        <button id="sheetMinus">−</button>
        <span class="n" id="sheetQtyLabel">${sheetQty}</span>
        <button id="sheetPlus">+</button>
      </div>
      <button class="sheet-add-btn" id="sheetAddBtn">
        <span>加入購物車</span><span>HK$${sheetUnitPrice()*sheetQty}</span>
      </button>
    </div>
  `;

  document.getElementById('sheetCloseBtn').addEventListener('click', closeSheet);
  document.getElementById('sheetMinus').addEventListener('click', ()=>{ if(sheetQty>1){ sheetQty--; renderSheet(); } });
  document.getElementById('sheetPlus').addEventListener('click', ()=>{ sheetQty++; renderSheet(); });
  document.getElementById('sheetAddBtn').addEventListener('click', addSheetToCart);

  sheetContent.querySelectorAll('.radio').forEach(r=>{
    r.addEventListener('click', e=>{
      const gi = e.currentTarget.dataset.gi, ci = parseInt(e.currentTarget.dataset.ci);
      sheetSelections[gi] = [ci];
      renderSheet();
    });
  });
  sheetContent.querySelectorAll('.checkbox').forEach(cbox=>{
    cbox.addEventListener('click', e=>{
      const gi = e.currentTarget.dataset.gi, ci = parseInt(e.currentTarget.dataset.ci);
      const arr = sheetSelections[gi] || [];
      const idx = arr.indexOf(ci);
      if(idx>-1) arr.splice(idx,1); else arr.push(ci);
      sheetSelections[gi] = arr;
      renderSheet();
    });
  });
}

function closeSheet(){
  sheetOverlay.classList.remove('show');
  activeSheetItem = null;
}

function addSheetToCart(){
  const it = activeSheetItem;
  const noteVal = document.getElementById('sheetNote').value;
  const selCopy = JSON.parse(JSON.stringify(sheetSelections));
  cart.push({
    itemId: it.id,
    qty: sheetQty,
    simple:false,
    selections: selCopy,
    note: noteVal,
    unitPrice: sheetUnitPrice()
  });
  closeSheet();
  refreshAll();
}

/* ===================== CART BAR + CART SCREEN ===================== */
function cartTotalCount(){ return cart.reduce((s,c)=>s+c.qty,0); }
function cartSubtotal(){ return cart.reduce((s,c)=>s+c.qty*c.unitPrice,0); }

function refreshAll(){
  renderMenu();
  renderCartBar();
  renderCartScreen();
}

function renderCartBar(){
  const bar = document.getElementById('cartBar');
  const count = cartTotalCount();
  document.getElementById('cartBubble').textContent = count;
  document.getElementById('cartBarTotal').textContent = `HK$${cartSubtotal()}`;
  bar.classList.toggle('show', count>0);
}

document.getElementById('cartBar').addEventListener('click', ()=> showScreen('cartScreen'));
document.getElementById('cartBack').addEventListener('click', ()=> showScreen('storeScreen'));
document.getElementById('backToStore').addEventListener('click', ()=>{ cart=[]; refreshAll(); showScreen('storeScreen'); });

function optionSummary(c){
  const it = allItems[c.itemId];
  if(c.simple || !it.options || it.options.length===0) return '';
  const parts = [];
  it.options.forEach((grp,gi)=>{
    (c.selections[gi]||[]).forEach(ci=>{ parts.push(grp.choices[ci].label); });
  });
  if(c.note) parts.push(`備註: ${c.note}`);
  return parts.join(' · ');
}

function renderCartScreen(){
  const body = document.getElementById('cartBody');
  if(cart.length===0){
    body.innerHTML = `<div class="empty-cart">購物車係空嘅 —— 返去揀啲蛋仔啦 🥚</div>`;
    return;
  }
  const subtotal = cartSubtotal();
  const deliveryFee = currentMode==='delivery' ? 12 : 0;
  const serviceFee = Math.round(subtotal*0.05);
  const discount = subtotal>=50 ? 10 : 0;
  const total = subtotal + deliveryFee + serviceFee - discount;

  body.innerHTML = `
    <div class="cart-store-strip">
      <span class="ic">🥚</span>
      <div><b>叮叮蛋仔 DingDing Waffle</b><span>深水埗桂林街 42 號</span></div>
    </div>
    <div class="cart-list">
      ${cart.map((c,idx)=>{
        const it = allItems[c.itemId];
        const photoInner = it.photo ? `<div class="bubbles"></div>` : '';
        const summary = optionSummary(c);
        return `
        <div class="cart-item">
          <div class="cart-item-photo ${it.photo?'':'blank'}" style="${it.photo?`background:linear-gradient(135deg,#FFD873,#F0A93A)`:''}">${photoInner}</div>
          <div class="cart-item-info">
            <p class="cart-item-name">${it.name}</p>
            ${summary ? `<p class="cart-item-opts">${summary}</p>` : ''}
            <div class="cart-item-bottom">
              <span class="cart-item-price">HK$${c.unitPrice*c.qty}</span>
              <div class="cart-item-stepper">
                <button data-idx="${idx}" data-delta="-1">−</button>
                <span class="n">${c.qty}</span>
                <button data-idx="${idx}" data-delta="1">+</button>
              </div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="addr-card">
      <span class="ic">${currentMode==='delivery' ? '🛵' : '🏬'}</span>
      <div>
        <b>${currentMode==='delivery' ? '送餐地址' : '自取地點'}</b>
        <span>${currentMode==='delivery' ? '請於結帳時輸入地址' : '深水埗桂林街 42 號 · 12分鐘後可取'}</span>
      </div>
      <span class="chg">更改</span>
    </div>

    <div class="promo-input-row">
      <span>🏷️</span>
      <input type="text" placeholder="輸入優惠碼 (例如 EGG10)">
      <button>套用</button>
    </div>

    <div class="fee-card">
      <div class="fee-row"><span>小計</span><span>HK$${subtotal}</span></div>
      <div class="fee-row"><span>${currentMode==='delivery'?'外送費':'自取服務費'}</span><span>HK$${deliveryFee}</span></div>
      <div class="fee-row"><span>平台服務費</span><span>HK$${serviceFee}</span></div>
      ${discount>0 ? `<div class="fee-row"><span>優惠折扣</span><span class="discount">-HK$${discount}</span></div>` : ''}
      <div class="fee-row total"><span>合共</span><span>HK$${total}</span></div>
    </div>

    <div class="checkout-footer">
      <button class="checkout-btn" id="checkoutBtn"><span>確認落單</span><span>HK$${total}</span></button>
    </div>
  `;

  body.querySelectorAll('.cart-item-stepper button').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const idx = parseInt(e.currentTarget.dataset.idx);
      const delta = parseInt(e.currentTarget.dataset.delta);
      cart[idx].qty += delta;
      if(cart[idx].qty<=0) cart.splice(idx,1);
      refreshAll();
    });
  });

  const checkoutBtn = document.getElementById('checkoutBtn');
  if(checkoutBtn){
    checkoutBtn.addEventListener('click', ()=>{
      showScreen('confirmScreen');
    });
  }
}

/* ===================== MODE TOGGLE ===================== */
document.querySelectorAll('.mode-toggle button').forEach(btn=>{
  btn.addEventListener('click', e=>{
    document.querySelectorAll('.mode-toggle button').forEach(b=>b.classList.remove('active'));
    e.currentTarget.classList.add('active');
    currentMode = e.currentTarget.dataset.mode;
    renderCartScreen();
  });
});

/* ===================== SCREEN NAV ===================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ===================== INIT ===================== */
renderMenu();
renderCartBar();
renderCartScreen();
</script>

</body>
</html>
